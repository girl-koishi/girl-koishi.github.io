<style>
/* ========== RESET & BASE (VERBATIM FROM index.html) ========== */
:root{
  --bg:#060d1f;--panel:rgba(8,18,42,.92);--border:rgba(0,210,255,.12);--border-h:rgba(0,210,255,.28);
  --cyan:#00d2ff;--blue:#3980ff;--green:#00e5a0;--amber:#ffb300;--red:#ff3d57;--purple:#b388ff;
  --t1:#d8eaf8;--t2:#8ab4d8;--t3:#2e4a66;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--t1);font-size:14px}

::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:rgba(0,229,160,.15);border-radius:2px}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(0,180,120,.16),transparent 60%),
    radial-gradient(ellipse 50% 25% at 15% 105%,rgba(0,229,160,.04),transparent 55%),
    radial-gradient(ellipse 50% 25% at 85% 105%,rgba(57,128,255,.03),transparent 55%);}

#app{width:100vw;height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

/* ========== HEADER (VERBATIM — green accent for status dot) ========== */
#hd{height:72px;min-height:72px;display:flex;align-items:center;padding:0 20px;background:linear-gradient(180deg,rgba(6,13,31,.98) 0%,rgba(6,13,31,.94) 100%);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:10}
.hd-l{display:flex;align-items:center;gap:8px;width:140px;flex-shrink:0}
.hd-brace{color:var(--green);opacity:.25;font-size:18px;font-weight:200;letter-spacing:-2px}
.hd-line{height:20px;width:1px;background:linear-gradient(180deg,transparent,var(--green),transparent)}
.hd-c{flex:1;display:flex;align-items:center;justify-content:center;gap:0;overflow:hidden}
.hd-title{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 8px;border:1px solid rgba(0,210,255,.15);border-radius:6px;background:linear-gradient(135deg,rgba(0,210,255,.03) 0%,rgba(57,128,255,.03) 100%);transition:.25s;user-select:none}
.hd-title:hover{background:linear-gradient(135deg,rgba(0,210,255,.06) 0%,rgba(57,128,255,.06) 100%);border-color:rgba(0,210,255,.28);box-shadow:0 0 20px rgba(0,210,255,.08)}
.hd-t1{font-size:20px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#00d2ff 0%,#3980ff 50%,#b388ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;text-shadow:none}
.hd-t2{font-size:7px;font-weight:300;letter-spacing:1px;color:rgba(138,180,216,.55);text-transform:uppercase}
.hd-r{display:flex;align-items:center;gap:8px;width:140px;justify-content:flex-end;flex-shrink:0}
.hd-clock{font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:10px;color:var(--green);background:rgba(0,229,160,.04);padding:3px 9px;border-radius:3px;border:1px solid rgba(0,229,160,.08)}
.hd-st{display:flex;align-items:center;gap:4px;font-size:8px;padding:2px 7px;border-radius:8px;background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.1);color:var(--green);white-space:nowrap}
.hd-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.8s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,160,.5)}50%{box-shadow:0 0 0 4px rgba(0,229,160,0)}}

/* ========== NAV BAR (VERBATIM — 9 items, 发电侧 is .on) ========== */
#nb{height:34px;min-height:34px;display:flex;align-items:center;justify-content:flex-start;gap:1px;padding:0 16px;background:rgba(6,13,31,.90);border-bottom:1px solid rgba(0,229,160,.05);flex-shrink:0;z-index:9;overflow-x:auto}
.nl{display:flex;align-items:center;gap:4px;height:28px;padding:0 13px;border-radius:3px;font-size:11px;color:var(--t2);cursor:pointer;transition:.2s;text-decoration:none;border:1px solid transparent;white-space:nowrap;letter-spacing:.3px}
.nl:hover{color:var(--green);background:rgba(0,229,160,.05);border-color:rgba(0,229,160,.08)}
.nl.on{color:var(--green);background:rgba(0,229,160,.08);border-color:rgba(0,229,160,.16);box-shadow:0 0 8px rgba(0,229,160,.06)}
.nl i{font-size:7px}
.nl.dd{position:relative}
.nl.dd:hover .dd-menu{display:block}
.dd-menu{display:none;position:absolute;top:100%;left:0;background:rgba(8,18,42,.95);border:1px solid rgba(0,210,255,.12);border-radius:4px;padding:4px 0;min-width:120px;z-index:100}
.dd-menu a{display:block;padding:6px 14px;font-size:11px;color:var(--t2);text-decoration:none;transition:.2s;white-space:nowrap}
.dd-menu a:hover{color:var(--cyan);background:rgba(0,210,255,.05)}

/* ========== MAIN GRID (VERBATIM) ========== */
#mn{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 250px;grid-template-rows:1fr;gap:6px;padding:6px;overflow:hidden}
.cl{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.cl.mid{grid-row:1/2}

/* ========== PANEL (VERBATIM) ========== */
.pnl{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,box-shadow .3s;box-shadow:0 1px 8px rgba(0,0,0,.25)}
.pnl:hover{border-color:var(--border-h);box-shadow:0 1px 8px rgba(0,0,0,.25),0 0 10px rgba(0,229,160,.04)}
.ph{display:flex;align-items:center;gap:6px;padding:6px 10px 4px;border-bottom:1px solid rgba(0,229,160,.035);flex-shrink:0}
.phi{width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;flex-shrink:0}
.phi.c{background:rgba(0,229,160,.1);color:var(--green)}.phi.r{background:rgba(255,61,87,.1);color:var(--red)}
.phi.g{background:rgba(0,229,160,.1);color:var(--green)}.phi.a{background:rgba(255,179,0,.1);color:var(--amber)}
.phi.p{background:rgba(179,136,255,.1);color:var(--purple)}.phi.b{background:rgba(57,128,255,.1);color:var(--blue)}
.pht{font-size:10px;font-weight:600;color:var(--t1);flex:1}.phtag{font-size:8px;padding:1px 5px;border-radius:4px;background:rgba(0,229,160,.05);color:var(--green);border:1px solid rgba(0,229,160,.1)}

/* ========== TAB BAR (VERBATIM) ========== */

.tb.on{color:var(--green);background:rgba(0,229,160,.07);border-color:rgba(0,229,160,.12);border-bottom:1px solid var(--panel)}

.uc{padding:6px 7px;background:rgba(0,229,160,.01);border:1px solid rgba(0,229,160,.035);border-radius:4px;display:flex;flex-direction:column;gap:3px;transition:.2s}
.uc:hover{background:rgba(0,229,160,.025);border-color:rgba(0,229,160,.1)}

.ucs.a{background:var(--amber);box-shadow:0 0 4px rgba(255,179,0,.5)}.ucs.c{background:var(--cyan);box-shadow:0 0 4px rgba(0,210,255,.5)}

.ucv.g{color:var(--green)}.ucv.b{color:var(--blue)}.ucv.a{color:var(--amber)}.ucv.c{color:var(--cyan)}
.ucu{font-size:8px;color:var(--t2);margin-left:2px}
.ucb{height:2px;background:rgba(0,229,160,.03);border-radius:1px;overflow:hidden}
.ucf{height:100%;border-radius:1px;transition:width 1s ease}

/* ========== QUICK STATS (page-specific) ========== */
.qs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:6px 8px}
.qsi{padding:5px 6px;background:rgba(0,229,160,.01);border:1px solid rgba(0,229,160,.035);border-radius:3px;text-align:center}
.qsl{font-size:8px;color:var(--t2);margin-bottom:2px}
.qsv{font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:12px;font-weight:700;color:var(--green)}

/* ========== PARAMS TABLE (page-specific) ========== */
.pt{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.pth{display:grid;grid-template-columns:1.2fr 1fr 1fr .9fr .7fr;gap:1px;padding:5px 8px;font-size:8px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid rgba(0,229,160,.04);flex-shrink:0}
.ptr{display:grid;grid-template-columns:1.2fr 1fr 1fr .9fr .7fr;gap:1px;padding:5px 8px;font-size:7px;border-bottom:1px solid rgba(255,255,255,.01);align-items:center;transition:.15s}
.ptr:hover{background:rgba(0,229,160,.02)}
.ptn{color:var(--t1);font-size:7px}
.ptv{font-family:"SF Mono","Fira Code","Consolas",monospace;color:var(--green);font-weight:600;font-size:7px}
.ptrt{font-family:"SF Mono","Fira Code","Consolas",monospace;color:var(--t2);font-size:8px}
.ptd{font-family:"SF Mono","Fira Code","Consolas",monospace;font-size:8px}
.ptd.up{color:var(--red)}.ptd.down{color:var(--green)}
.ptb{font-size:7px;padding:1px 5px;border-radius:3px;text-align:center;font-weight:600}
.ptb.ok{background:rgba(0,229,160,.08);color:var(--green);border:1px solid rgba(0,229,160,.12)}
.ptb.warn{background:rgba(255,179,0,.08);color:var(--amber);border:1px solid rgba(255,179,0,.12)}

/* ========== Focus Indicator (Accessibility) ========== */
:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15);
}
</style>

<script>
  // ===== 分析下拉菜单点击切换 =====
  document.addEventListener('DOMContentLoaded', function () {
    var ddStyle = document.createElement('style');
    ddStyle.textContent = '.nl.dd.open .dd-menu{display:block}';
    document.head.appendChild(ddStyle);

    document.querySelectorAll('.nl.dd').forEach(function (dd) {
      var menu = dd.querySelector('.dd-menu');
      if (!menu) return;
      dd.addEventListener('click', function (e) {
        if (menu.contains(e.target)) return;
        e.stopPropagation();
        e.preventDefault();
        var willOpen = !dd.classList.contains('open');
        document.querySelectorAll('.nl.dd.open').forEach(function (other) {
          other.classList.remove('open');
        });
        if (willOpen) dd.classList.add('open');
      });
    });

    document.addEventListener('click', function (e) {
      document.querySelectorAll('.nl.dd.open').forEach(function (dd) {
        if (!dd.contains(e.target)) dd.classList.remove('open');
      });
    });
  });
</script>
<script>

let WS=null,sd=null;
const fmt=(n,d)=>d?Number(n).toFixed(d):Math.round(n).toLocaleString();
const $=id=>document.getElementById(id);
function setT(id,v,u,d){const e=$(id);if(e)e.innerHTML=fmt(v,d)+(u?'<span class="ucu">'+u+'</span>':'');}

// CLOCK
function tick(){const d=new Date();$('clk').textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');}

    h+=`<div class="uc">
      <div class="uch">
        <i class="fas ${u.icon} uci ${u.color}"></i>
        <span class="ucn">${u.name}</span>
        <span class="ucs ${u.status==='r'?'r':u.color}"></span>
      </div>
      <div><span class="ucv ${u.color}">${u.power.toFixed(1)}</span><span class="ucu">MW</span></div>
      <div class="ucb"><div class="ucf" style="width:${u.load}%;background:linear-gradient(90deg,#004d2a,var(--${u.color==='g'?'green':u.color==='b'?'blue':u.color==='a'?'amber':'cyan'}))"></div></div>
    </div>`;
  });
  $('unitGrid').innerHTML=h;
}

// ===== ECHARTS TREND =====
let trendC;
function initTrend(){
  trendC=echarts.init($('trendChart'),'dark');
  window.charts = window.charts || []; window.charts.push(trendC);
  const now=Date.now();
  const fire=[],wind=[],solar=[],storage=[];
  for(let i=23;i>=0;i--){
    const t=now-i*1800000;
    const h=new Date(t).getHours()+new Date(t).getMinutes()/60;
    fire.push([t,Math.round(800+80*Math.sin((h-8)/24*2*Math.PI-0.3)+(Math.random()-0.5)*30)]);
    wind.push([t,Math.round(120+40*Math.sin((h-6)/24*2*Math.PI+0.5)+(Math.random()-0.5)*15)]);
    solar.push([t,Math.round(Math.max(0,90+60*Math.sin((h-12)/12*Math.PI))+(Math.random()-0.5)*8)]);
    storage.push([t,Math.round(40+20*Math.sin((h-4)/24*2*Math.PI)+(Math.random()-0.5)*8)]);
  }
  trendC.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:'rgba(6,13,31,.94)',borderColor:'rgba(0,229,160,.12)',textStyle:{color:'#d8eaf8',fontSize:9},
      formatter:p=>new Date(p[0].value[0]).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'<br/>'+p.map(i=>i.marker+' '+i.seriesName+': '+i.value[1]+'MW').join('<br/>')},
    legend:{data:['火电','风电','光伏','储能'],textStyle:{color:'#6a8ba8',fontSize:8},top:2,right:6,itemWidth:10,itemHeight:5},
    grid:{left:'5%',right:'4%',top:'18%',bottom:'8%'},
    xAxis:{type:'time',axisLine:{lineStyle:{color:'rgba(0,229,160,.05)'}},axisLabel:{color:'#6a8ba8',fontSize:8,formatter:v=>new Date(v).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})},splitLine:{show:false}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(0,229,160,.025)',type:'dashed'}},axisLabel:{color:'#6a8ba8',fontSize:8,formatter:'{value}'}},
    series:[
      {name:'火电',type:'line',smooth:true,symbol:'none',stack:'a',data:fire,lineStyle:{color:'#00e5a0',width:1.5},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,229,160,.15)'},{offset:1,color:'rgba(0,229,160,.002)'}])}},
      {name:'风电',type:'line',smooth:true,symbol:'none',stack:'a',data:wind,lineStyle:{color:'#3980ff',width:1.2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(57,128,255,.12)'},{offset:1,color:'rgba(57,128,255,.002)'}])}},
      {name:'光伏',type:'line',smooth:true,symbol:'none',stack:'a',data:solar,lineStyle:{color:'#ffb300',width:1.2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(255,179,0,.12)'},{offset:1,color:'rgba(255,179,0,.002)'}])}},
      {name:'储能',type:'line',smooth:true,symbol:'none',stack:'a',data:storage,lineStyle:{color:'#00d2ff',width:1.2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,210,255,.12)'},{offset:1,color:'rgba(0,210,255,.002)'}])}},
    ]
  });
}

// ===== WEBSOCKET =====
function connectWS(){
  if(WS){try{WS.close();}catch(e){}}
  try{
    WS=new WebSocket('ws://localhost:3080');
    WS.onopen=()=>console.log('[WS] OK');
    WS.onmessage=e=>{
      try{const m=JSON.parse(e.data);sd=m.data;if(m.type==='init'){updateUI(sd);}else{updateUI(sd);}}catch(ex){}
    };
    WS.onclose=()=>setTimeout(connectWS,3000);
    WS.onerror=()=>{};
  }catch(e){console.log('[WS] fallback');}
}

function updateUI(d){
  if(d&&d.totalPower){
    setT('kpi1',d.totalPower.toFixed(1),'MW',1);
    if(gaugeC)gaugeC.setOption({series:[{data:[{value:Math.round(d.totalPower),name:'当前总发电功率'}]}]});
  }
}

// ===== INIT =====
function init(){
  initUnits();
  initParams();
  initGauge();
  initTrend();
  initDonut();
  connectWS();
  // Fallback: simulate live data if WS not available
  setInterval(()=>{
    if(!sd||!sd.totalPower){
      // Simulate minor fluctuation
      UNITS.forEach(u=>{
        if(u.power>0){
          u.power=Math.max(0,u.power+(Math.random()-0.5)*8);
          u.load=Math.round(u.power/u.rated*100);
        }
      });
      const total=UNITS.reduce((s,u)=>s+u.power,0);
      if(gaugeC)gaugeC.setOption({series:[{data:[{value:Math.round(total),name:'当前总发电功率'}]}]});
      setT('kpi1',total.toFixed(1),'MW',1);
    }
  },3000);
}
window.addEventListener('resize',()=>{
  if(gaugeC)gaugeC.resize();
  if(trendC)trendC.resize();
  if(donutC)donutC.resize();
});
window.addEventListener('beforeunload', () => {
  if (window.charts) {
    window.charts.forEach(c => {
      if (c && !c.isDisposed()) {
        c.dispose();
      }
    });
    window.charts = [];
  }
});
document.addEventListener('DOMContentLoaded',init);
</script>
